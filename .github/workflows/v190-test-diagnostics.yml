name: AIMS FLOW v1.9 Test Diagnostics

on:
  push:
    branches: [aims-flow-r105-next-v190-stabilization]
    paths:
      - '.github/workflows/v190-test-diagnostics.yml'
  workflow_dispatch:

concurrency:
  group: flow-v190-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run test shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find test -maxdepth 1 -name '*_test.dart' -type f | sort)
          selected=0
          for i in "${!files[@]}"; do
            if (( i % 4 != SHARD )); then continue; fi
            file="${files[$i]}"
            selected=$((selected+1))
            echo "============================================================"
            echo "SHARD $SHARD · RUNNING $file"
            echo "============================================================"
            timeout --signal=TERM --kill-after=10s 120s flutter test -r expanded "$file"
          done
          test "$selected" -gt 0
          echo "SHARD $SHARD PASSED $selected FILES"
