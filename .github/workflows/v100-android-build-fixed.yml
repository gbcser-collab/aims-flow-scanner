name: Build AIMS Flow V100 Android APK Fixed

on:
  push:
    branches: [v100-native]
    paths:
      - '.github/workflows/v100-android-build-fixed.yml'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  build-v100-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android
      - name: Configure Android permissions and identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions='''
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          '''
          s=s.replace('<application', permissions+'\n    <application',1)
          s=s.replace('android:label="aims_flow_scanner"','android:label="AIMS Flow V100"')
          p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: CMR parser tests
        run: flutter test test/cmr_parser_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: APK sanity check
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk AIMS-FLOW-V100-debug.apk
          ls -lh AIMS-FLOW-V100-debug.apk
          sha256sum AIMS-FLOW-V100-debug.apk | tee AIMS-FLOW-V100-debug.sha256
      - name: Upload V100 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-FLOW-V100-ANDROID
          path: |
            AIMS-FLOW-V100-debug.apk
            AIMS-FLOW-V100-debug.sha256
          if-no-files-found: error
