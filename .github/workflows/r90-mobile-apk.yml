name: Build R90 Mobile APK

on:
  push:
    branches: [aims-flow-driver-v1-r90-hardening]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'pubspec.yaml'
      - '.github/workflows/r90-mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: aims-flow-r90-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-r90-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android

      - name: Configure native R90 Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions=[
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.FOREGROUND_SERVICE_MICROPHONE',
            'android.permission.RECORD_AUDIO',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          block='\n'.join(f'    <uses-permission android:name="{name}" />' for name in permissions)
          queries='\n'.join([
              '    <queries>',
              '        <intent><action android:name="android.speech.RecognitionService" /></intent>',
              '        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>',
              '    </queries>',
          ])
          s=s.replace('<application',block+'\n'+queries+'\n    <application',1)
          s=s.replace('android:label="aims_flow_scanner"','android:label="AIMS Flow R90"')
          assist='\n'.join([
              '            <intent-filter>',
              '                <action android:name="android.intent.action.ASSIST" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '            </intent-filter>',
              '',
          ])
          end=s.find('</activity>')
          if end < 0:
              raise SystemExit('MainActivity closing tag missing')
          s=s[:end]+assist+s[end:]
          service='\n'.join([
              '        <service',
              '            android:name=".AimsHandsFreeService"',
              '            android:enabled="true"',
              '            android:exported="false"',
              '            android:foregroundServiceType="microphone" />',
              '',
          ])
          s=s.replace('</application>',service+'    </application>',1)
          p.write_text(s)

          target=Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner')
          target.mkdir(parents=True,exist_ok=True)
          shutil.copy2('native/android/MainActivity.kt',target/'MainActivity.kt')
          shutil.copy2('native/android/AimsHandsFreeService.kt',target/'AimsHandsFreeService.kt')

          g=Path('android/app/build.gradle.kts')
          text=g.read_text()
          text=text.replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text=text.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring(' not in text:
              if 'dependencies {' in text:
                  text=text.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
              else:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          g.write_text(text)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build installable R90 APK
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
        run: |
          flutter build apk --debug \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN="${AIMS_TRACKING_TOKEN}"
          cp build/app/outputs/flutter-apk/app-debug.apk AIMS-Flow-R90-Mobile.apk

      - name: APK sanity
        run: |
          test -s AIMS-Flow-R90-Mobile.apk
          unzip -t AIMS-Flow-R90-Mobile.apk >/tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          sha256sum AIMS-Flow-R90-Mobile.apk > AIMS-Flow-R90-Mobile.sha256
          ls -lh AIMS-Flow-R90-Mobile.apk

      - name: Upload R90 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-R90-Mobile
          path: |
            AIMS-Flow-R90-Mobile.apk
            AIMS-Flow-R90-Mobile.sha256
          if-no-files-found: error
