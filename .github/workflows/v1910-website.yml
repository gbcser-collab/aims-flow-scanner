name: Validate FLOW website integration
on:
  push:
    branches: [aims-flow-r105-next-v190-stabilization]
    paths: ['integration/**', 'server/aims-tracking/mileage_report_lib.php', 'server/aims-tracking/monthly_report_lib.php', 'server/aims-tracking/tests/mileage_report_test.php', 'ci/assemble_website.py', 'ci/package_website.py', '.github/workflows/v1910-website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged PHP and package script
        run: |
          find integration -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m py_compile ci/assemble_website.py ci/package_website.py
          python3 -m unittest discover -s integration -p 'test_package_website.py'
      - name: Mileage and accounting regressions
        run: php server/aims-tracking/tests/mileage_report_test.php
      - name: Render real admin pages against SQLite
        if: ${{ !cancelled() }}
        run: python3 integration/test_admin_render.py
      - name: Exercise mileage admin forms and exports over HTTP
        if: ${{ !cancelled() }}
        run: python3 integration/test_mileage_http.py
      - uses: actions/upload-artifact@v4
        with:
          name: mileage-rendered-fixture
          path: mileage-fixture/
          if-no-files-found: error
      - name: Exercise session authorization over HTTP
        if: ${{ !cancelled() }}
        run: python3 integration/test_session_without_config.py
  validate:
    needs: php
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test runner
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install webkit
      - uses: actions/download-artifact@v4
        with:
          name: mileage-rendered-fixture
          path: mileage-fixture/
      - name: Check iPhone, iPad and desktop layouts
        run: |
          mkdir -p integration/site/flow/assets
          base64 --decode < integration/flow-logo.png.b64 > integration/site/flow/assets/aims-flow-logo.png
          node integration/test-website.cjs
          mkdir -p homepage-fixture
          tar -xzf integration/fixtures/home-v43.tar.gz -C homepage-fixture
          node integration/test-homepage.cjs
          tar -xzf integration/fixtures/mileage-assets-v44.tar.gz -C mileage-fixture
          node integration/test-mileage.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: AIMS-FLOW-website-WebKit-checks
          path: website-checks/
          if-no-files-found: error

