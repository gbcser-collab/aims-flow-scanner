name: Build AIMS Flow NEXT Debug APK

on:
  push:
    branches: [aims-flow-r105-next-v180-dev3, aims-flow-r105-next-v180-dev4, aims-flow-r105-next-v180-dev5, aims-flow-r105-next-v180-dev6-operations, aims-flow-r105-next-v180-dev9-admin-everything-useful, codex/flow-id-pin-dev9]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'native/**'
      - '.github/workflows/next-debug-apk.yml'
  workflow_dispatch:

concurrency:
  group: aims-flow-next-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-next-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_next_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_next_template
          cp -R /tmp/aims_next_template/android ./android

      - name: Configure NEXT debug application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          permission_block = '\n'.join(
              f'    <uses-permission android:name="{name}" />'
              for name in permissions
          )
          queries = '\n'.join([
              '    <queries>',
              '        <intent>',
              '            <action android:name="android.intent.action.TTS_SERVICE" />',
              '        </intent>',
              '    </queries>',
          ])
          text = text.replace(
              '<application',
              permission_block + '\n' + queries + '\n    <application',
              1,
          )
          text = text.replace(
              'android:label="aims_flow_scanner"',
              'android:label="AIMS Flow NEXT"',
          )
          text = text.replace('<application', '<application android:allowBackup="false"', 1)
          manifest.write_text(text)

          native = Path('native/android')
          target = Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(native / 'MainActivity.kt', target / 'MainActivity.kt')

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace(
              'applicationId = "hu.logisticaims.aims_flow_scanner"',
              'applicationId = "hu.logisticaims.aims_flow_scanner.next"',
          )
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring(' not in g:
              if 'dependencies {' in g:
                  g = g.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1,
                  )
              else:
                  g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          gradle.write_text(g)
          PY

      - name: Install AIMS notification sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          base64 -d native/android/raw/aims_new_job.mp3.b64 > android/app/src/main/res/raw/aims_new_job.mp3
          base64 -d native/android/raw/aims_new_message.mp3.b64 > android/app/src/main/res/raw/aims_new_message.mp3
          test -s android/app/src/main/res/raw/aims_new_job.mp3
          test -s android/app/src/main/res/raw/aims_new_message.mp3

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build NEXT debug APK
        env:
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build apk --debug \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk AIMS-Flow-NEXT-v1.8.0-dev10-auth.apk
          sha256sum AIMS-Flow-NEXT-v1.8.0-dev10-auth.apk | tee AIMS-Flow-NEXT-v1.8.0-dev10-auth.apk.sha256

      - name: Upload NEXT APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-NEXT-v1.8.0-dev10-auth
          path: |
            AIMS-Flow-NEXT-v1.8.0-dev10-auth.apk
            AIMS-Flow-NEXT-v1.8.0-dev10-auth.apk.sha256
          if-no-files-found: error
          retention-days: 30
