name: Build and deep-test Android APK

on:
  push:
    branches: [ main, v0.8-dev, v0.9-pro, v1.0-road, v1.3-smart-operations ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'ci/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm is not available on this runner'
            exit 1
          fi

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android

      - name: Configure Android permissions for AIMS Flow tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          names = [
              'android.permission.CAMERA',
              'android.permission.INTERNET',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
          ]
          permissions = '\n'.join(
              f'    <uses-permission android:name="{name}" />' for name in names
          )
          s = s.replace('<application', permissions + '\n    <application', 1)
          s = s.replace('android:label="aims_flow_scanner"', 'android:label="AIMS Flow"')
          p.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(g)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Firebase client configuration status
        env:
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
        run: |
          mkdir -p test-evidence
          if [ -n "$AIMS_FIREBASE_API_KEY" ] &&              [ -n "$AIMS_FIREBASE_PROJECT_ID" ] &&              [ -n "$AIMS_FIREBASE_MESSAGING_SENDER_ID" ] &&              [ -n "$AIMS_FIREBASE_ANDROID_APP_ID" ]; then
            echo "firebase_client_configured=true" | tee test-evidence/firebase-config-status.txt
          else
            echo "firebase_client_configured=false" | tee test-evidence/firebase-config-status.txt
          fi

      - name: Build production-like debug APK
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build apk --debug \
            --dart-define=AIMS_API_BASE_URL=https://logistic-aims.hu/api \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN="$AIMS_TRACKING_TOKEN" \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"

      - name: APK sanity check
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk > /tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload production-like APK before device test
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-v1.3-SMART-OPERATIONS
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build isolated E2E APK
        run: |
          # This APK is NOT uploaded. The compile-time flag bypasses device approval
          # and disables backend synchronization only for the emulator test run.
          flutter build apk --debug --dart-define=AIMS_E2E_TEST=true
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Deep end-to-end Smart Scanner test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android_smoke_test.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-v1.3-test-evidence
          path: test-evidence/
          if-no-files-found: warn
