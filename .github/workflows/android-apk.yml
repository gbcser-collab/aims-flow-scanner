name: Build and smoke-test Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, marker + '\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: APK sanity check
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk > /tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Smoke-test install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant hu.logisticaims.aims_flow_scanner android.permission.CAMERA || true
            adb shell am force-stop hu.logisticaims.aims_flow_scanner
            adb shell monkey -p hu.logisticaims.aims_flow_scanner -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'hu.logisticaims.aims_flow_scanner'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-Scanner-Samsung-v0.3-verified
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
