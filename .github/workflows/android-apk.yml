name: Build and test NAILFIT Android APK

on:
  push:
    branches: [ nailfit-mvp ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo '/dev/kvm is not available on this runner'
            exit 1
          fi

      - name: Generate standalone Android platform
        run: |
          rm -rf /tmp/nailfit_template
          flutter create --platforms=android --org hu.logisticaims --project-name nailfit /tmp/nailfit_template
          cp -R /tmp/nailfit_template/android ./android
          sed -i 's/android:label="nailfit"/android:label="NAILFIT"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: APK sanity check
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk > /tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAILFIT-v0.9.0-Android
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Deep launch smoke-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android_smoke_test.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAILFIT-v0.9.0-test-evidence
          path: test-evidence/
          if-no-files-found: warn
