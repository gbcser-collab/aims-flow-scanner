name: Build and deep-test Android APK

on:
  push:
    branches: [ main, v0.8-dev, v0.9-pro, v1.0-road, v1.0-unified-flow-ui ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm is not available on this runner'
            exit 1
          fi

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '''\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' + permissions)
          path.write_text(text)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=AIMS_API_BASE_URL=https://logistic-aims.hu/api

      - name: APK sanity check
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk > /tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK before device test
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-v1.0-UNIFIED-ANDROID
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Deep end-to-end AIMS Flow test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android_smoke_test.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-v1.0-UNIFIED-test-evidence
          path: test-evidence/
          if-no-files-found: warn
