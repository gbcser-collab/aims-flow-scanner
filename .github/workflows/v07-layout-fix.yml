name: NailFit v0.7 one-shot layout fix

on:
  push:
    branches:
      - nailfit-mvp
    paths:
      - .github/workflows/v07-layout-fix.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nailfit-mvp
          fetch-depth: 0

      - name: Patch premium layout constraints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/nailfit_app.dart')
          text = path.read_text(encoding='utf-8')

          old = """        Row(
          crossAxisAlignment: CrossAxisAlignment.stretch,
          children: [
            Expanded(flex: 3, child: _aiMatchCard()),
            const SizedBox(width: 10),
            Expanded(flex: 2, child: _seasonCard()),
          ],
        ),"""
          new = """        SizedBox(
          height: 210,
          child: Row(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              Expanded(flex: 3, child: _aiMatchCard()),
              const SizedBox(width: 10),
              Expanded(flex: 2, child: _seasonCard()),
            ],
          ),
        ),"""
          if old not in text:
              raise SystemExit('Expected recommendation row was not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              "      child: CustomScrollView(\n        key: PageStorageKey('tab-$_tab'),\n",
              "      child: CustomScrollView(\n",
              1,
          )

          text = text.replace(
              "                  SizedBox(\n                    width: 180,\n                    child: FilledButton.icon(",
              "                  SizedBox(\n                    width: double.infinity,\n                    child: FilledButton.icon(",
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "NAILFIT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/nailfit_app.dart
          git commit -m "NailFit v0.7: fix premium mobile layout constraints"
          git push origin HEAD:nailfit-mvp
