name: Build AIMS FLOW v1.9 Pilot APK

on:
  push:
    branches: [aims-flow-r105-next-v190-stabilization]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'test/**'
      - 'ci/*android_signing.py'
      - 'pubspec.yaml'
      - '.github/workflows/v190-android-apk.yml'
  workflow_dispatch:
    inputs:
      require_stable_signing:
        description: Require the configured permanent signing key
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flow-v190-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_flow_v190_android
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_flow_v190_android
          cp -R /tmp/aims_flow_v190_android/android ./android

      - name: Configure pilot application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          permissions=[
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in permissions)
          queries='''    <queries>
                <intent>
                    <action android:name="android.intent.action.TTS_SERVICE" />
                </intent>
            </queries>'''
          text=text.replace('<application',block+'\n'+queries+'\n    <application',1)
          text=text.replace(
              '<application',
              '<application android:allowBackup="false" android:fullBackupContent="false"',
              1,
          )
          text=text.replace('android:label="aims_flow_scanner"','android:label="AIMS FLOW v1.9 Pilot"')
          manifest.write_text(text)

          target=Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner')
          target.mkdir(parents=True,exist_ok=True)
          for native in Path('native/android').glob('*.kt'):
              shutil.copy2(native,target / native.name)

          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('applicationId = "hu.logisticaims.aims_flow_scanner"','applicationId = "hu.logisticaims.aims_flow_scanner.v190"')
          g=g.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g=g.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring(' not in g:
              if 'dependencies {' in g:
                  g=g.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
              else:
                  g+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          # Only these unbundled optional OCR scripts may be ignored by R8.
          scripts=set()
          for source in Path('lib').rglob('*.dart'):
              scripts.update(re.findall(r'TextRecognitionScript\.(\w+)',source.read_text()))
          if scripts != {'latin'}:
              raise SystemExit('Update ML Kit dependencies and R8 rules before changing OCR scripts.')
          shutil.copy2('native/android/proguard-rules.pro','android/app/proguard-rules.pro')
          keep=Path('android/app/src/main/res/raw/flow_keep.xml')
          keep.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2('native/android/flow_keep.xml',keep)
          g+='\nandroid { buildTypes { getByName("release") { proguardFiles("proguard-rules.pro") } } }\n'
          gradle.write_text(g)
          PY

      - name: Install original FLOW notification sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          base64 -d native/android/raw/aims_new_job.mp3.b64 > android/app/src/main/res/raw/aims_new_job.mp3
          base64 -d native/android/raw/aims_new_message.mp3.b64 > android/app/src/main/res/raw/aims_new_message.mp3
          test -s android/app/src/main/res/raw/aims_new_job.mp3
          test -s android/app/src/main/res/raw/aims_new_message.mp3

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests file by file
        run: |
          set -euo pipefail
          failed=0
          for file in test/*_test.dart; do
            echo "============================================================"
            echo "RUNNING $file"
            echo "============================================================"
            if ! timeout --signal=TERM --kill-after=15s 150s flutter test -r expanded "$file"; then failed=1; fi
          done
          exit "$failed"

      - name: Client security guards
        run: |
          if grep -R "AIMS_TRACKING_TOKEN" lib --include='*.dart'; then
            echo "The Android client still contains a shared tracking token reference."
            exit 20
          fi
          grep -q "flutter_secure_storage" lib/services/flow_account_service.dart
          grep -q "aims-flow-auth-v2.php" lib/services/flow_account_service.dart
          grep -q "api/aims-tracking/session" lib/services/driver_api_service.dart

      - name: Signing preflight regression tests
        run: python3 ci/test_android_signing.py

      - name: Prepare and verify pilot signing key
        id: signing
        env:
          AIMS_ANDROID_KEYSTORE_BASE64: ${{ secrets.AIMS_ANDROID_KEYSTORE_BASE64 }}
          AIMS_ANDROID_STORE_PASSWORD: ${{ secrets.AIMS_ANDROID_STORE_PASSWORD }}
          AIMS_ANDROID_KEY_ALIAS: ${{ secrets.AIMS_ANDROID_KEY_ALIAS }}
          AIMS_ANDROID_KEY_PASSWORD: ${{ secrets.AIMS_ANDROID_KEY_PASSWORD }}
          AIMS_ANDROID_CERT_SHA256: ${{ secrets.AIMS_ANDROID_CERT_SHA256 }}
          AIMS_REQUIRE_STABLE_SIGNING: ${{ (vars.AIMS_REQUIRE_STABLE_SIGNING == 'true' || inputs.require_stable_signing == true) && 'true' || 'false' }}
        run: python3 ci/prepare_android_signing.py

      - name: Build APK
        env:
          AIMS_ANDROID_STORE_PASSWORD: ${{ secrets.AIMS_ANDROID_STORE_PASSWORD }}
          AIMS_ANDROID_KEY_ALIAS: ${{ secrets.AIMS_ANDROID_KEY_ALIAS }}
          AIMS_ANDROID_KEY_PASSWORD: ${{ secrets.AIMS_ANDROID_KEY_PASSWORD }}
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build apk --release \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk AIMS-FLOW-v1.9.8-PILOT-build38.apk
          sha256sum AIMS-FLOW-v1.9.8-PILOT-build38.apk | tee AIMS-FLOW-v1.9.8-PILOT-build38.apk.sha256

      - name: Verify APK signing and write public receipt
        env:
          AIMS_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          AIMS_ANDROID_CERT_SHA256: ${{ secrets.AIMS_ANDROID_CERT_SHA256 }}
        run: python3 ci/verify_android_signing.py AIMS-FLOW-v1.9.8-PILOT-build38.apk AIMS-FLOW-v1.9.8-PILOT-build38.signing.json

      - name: Remove private signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'aims-flow-signing.keystore').unlink(missing_ok=True)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-FLOW-v1.9.8-PILOT-build38
          path: |
            AIMS-FLOW-v1.9.8-PILOT-build38.apk
            AIMS-FLOW-v1.9.8-PILOT-build38.apk.sha256
            AIMS-FLOW-v1.9.8-PILOT-build38.signing.json
          if-no-files-found: error
          retention-days: 30

