name: Build AIMS FLOW v1.9 Pilot APK

on:
  push:
    branches: [aims-flow-r105-next-v190-stabilization]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/v190-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: flow-v190-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_flow_v190_android
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_flow_v190_android
          cp -R /tmp/aims_flow_v190_android/android ./android

      - name: Configure pilot application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          permissions=[
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in permissions)
          queries='''    <queries>
                <intent>
                    <action android:name="android.intent.action.TTS_SERVICE" />
                </intent>
            </queries>'''
          text=text.replace('<application',block+'\n'+queries+'\n    <application',1)
          text=text.replace(
              '<application',
              '<application android:allowBackup="false" android:fullBackupContent="false"',
              1,
          )
          text=text.replace('android:label="aims_flow_scanner"','android:label="AIMS FLOW v1.9 Pilot"')
          manifest.write_text(text)

          native=Path('native/android/MainActivity.kt')
          target=Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner/MainActivity.kt')
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(native,target)

          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('applicationId = "hu.logisticaims.aims_flow_scanner"','applicationId = "hu.logisticaims.aims_flow_scanner.v190"')
          g=g.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g=g.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring(' not in g:
              if 'dependencies {' in g:
                  g=g.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
              else:
                  g+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          gradle.write_text(g)
          PY

      - name: Install original FLOW notification sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          base64 -d native/android/raw/aims_new_job.mp3.b64 > android/app/src/main/res/raw/aims_new_job.mp3
          base64 -d native/android/raw/aims_new_message.mp3.b64 > android/app/src/main/res/raw/aims_new_message.mp3
          test -s android/app/src/main/res/raw/aims_new_job.mp3
          test -s android/app/src/main/res/raw/aims_new_message.mp3

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests file by file
        run: |
          set -euo pipefail
          for file in test/*_test.dart; do
            echo "============================================================"
            echo "RUNNING $file"
            echo "============================================================"
            timeout --signal=TERM --kill-after=15s 150s flutter test -r expanded "$file"
          done

      - name: Client security guards
        run: |
          if grep -R "AIMS_TRACKING_TOKEN" lib --include='*.dart'; then
            echo "The Android client still contains a shared tracking token reference."
            exit 20
          fi
          grep -q "flutter_secure_storage" lib/services/flow_account_service.dart
          grep -q "aims-flow-auth-v2.php" lib/services/flow_account_service.dart
          grep -q "api/aims-tracking/session" lib/services/driver_api_service.dart

      - name: Build APK
        env:
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build apk --debug \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk AIMS-FLOW-v1.9.3-PILOT-build33.apk
          sha256sum AIMS-FLOW-v1.9.3-PILOT-build33.apk | tee AIMS-FLOW-v1.9.3-PILOT-build33.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-FLOW-v1.9.3-PILOT-build33
          path: |
            AIMS-FLOW-v1.9.3-PILOT-build33.apk
            AIMS-FLOW-v1.9.3-PILOT-build33.apk.sha256
          if-no-files-found: error
          retention-days: 30

