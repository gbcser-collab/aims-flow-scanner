name: AIMS Flow R95 Autopilot V3 CI

on:
  push:
    branches: [ aims-flow-r95-autopilot-v3 ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android

      - name: Configure Android permissions and identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions='''
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
'''
          s=s.replace('<application', permissions+'\n    <application',1)
          s=s.replace('android:label="aims_flow_scanner"','android:label="AIMS Flow R95"')
          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Autopilot V3 tests
        run: flutter test test/autopilot_v3_test.dart

      - name: Full test suite
        run: flutter test

      - name: PHP syntax
        run: php -l server/aims-tracking/driver_autopilot.php

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Package APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk AIMS-FLOW-R95-AUTOPILOT-V3-debug.apk
          sha256sum AIMS-FLOW-R95-AUTOPILOT-V3-debug.apk | tee AIMS-FLOW-R95-AUTOPILOT-V3.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-FLOW-R95-AUTOPILOT-V3
          path: |
            AIMS-FLOW-R95-AUTOPILOT-V3-debug.apk
            AIMS-FLOW-R95-AUTOPILOT-V3.sha256
          if-no-files-found: error
          retention-days: 14
