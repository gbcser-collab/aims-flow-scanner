name: Build R88 Mobile Preview APK

on:
  push:
    branches:
      - preview/r88-mobile-apk
    paths:
      - 'lib/mobile_preview_main.dart'
      - 'assets/mobile_preview/**'
      - 'pubspec.yaml'
      - '.github/workflows/mobile-preview-apk.yml'
  workflow_dispatch:

concurrency:
  group: r88-mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated Android preview platform
        run: |
          rm -rf /tmp/aims_preview_template
          flutter create --platforms=android --org hu.logisticaims.preview --project-name aims_flow_r88_preview /tmp/aims_preview_template
          cp -R /tmp/aims_preview_template/android ./android
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:label="aims_flow_r88_preview"',
              'android:label="AIMS Flow R88"',
          )
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          expected = 'applicationId = "hu.logisticaims.preview.aims_flow_r88_preview"'
          if expected not in g:
              raise SystemExit('Preview applicationId was not generated as expected')
          g = g.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23',
          )
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring(' not in g:
              if 'dependencies {' in g:
                  g = g.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1,
                  )
              else:
                  g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          gradle.write_text(g)
          print(expected)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze preview
        run: flutter analyze lib/mobile_preview_main.dart

      - name: Build compact ARM64 release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            -t lib/mobile_preview_main.dart

      - name: APK sanity and size check
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/tmp/apk-test.txt
          tail -5 /tmp/apk-test.txt
          BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $BYTES"
          python3 - <<PY
          size = int("$BYTES")
          print(f"APK size: {size/1000000:.2f} MB")
          if size > 30000000:
              raise SystemExit(f"APK exceeds 30 MB target: {size/1000000:.2f} MB")
          PY
          cp "$APK" AIMS-Flow-R88-Driver-ARM64.apk
          sha256sum AIMS-Flow-R88-Driver-ARM64.apk > AIMS-Flow-R88-Driver-ARM64.sha256
          ls -lh AIMS-Flow-R88-Driver-ARM64.apk

      - name: Upload compact APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-R88-Driver-ARM64
          path: |
            AIMS-Flow-R88-Driver-ARM64.apk
            AIMS-Flow-R88-Driver-ARM64.sha256
          if-no-files-found: error
