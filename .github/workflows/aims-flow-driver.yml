name: Build AIMS Flow Driver Android

on:
  push:
    branches: [aims-flow-driver-v1, aims-flow-driver-v1-r87-recovery, aims-flow-driver-v1-r88-fixes, aims-flow-r94-full-system-hardening, aims-flow-r95-autopilot-v3, aims-flow-r100-ui-message-stability, aims-flow-r101-runtime-ui-hardening, aims-flow-r102-driver-first-stability, aims-flow-r103-production-signing, aims-flow-r104-next-level, aims-flow-r105-voice-announcer-only]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'native/**'
      - '.github/workflows/aims-flow-driver.yml'
  pull_request:
    branches: [aims-flow-r94-full-system-hardening, aims-flow-r104-next-level]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'server/**'
      - 'pubspec.yaml'
      - 'native/**'
      - '.github/workflows/aims-flow-driver.yml'
  workflow_dispatch:

concurrency:
  group: aims-flow-driver-${{ github.ref }}
  cancel-in-progress: true

env:
  AIMS_FIREBASE_API_KEY_FALLBACK: AIzaSyAAi61i7YCVXJ7Lh5QY0cYnZ42LISC-vNQ
  AIMS_FIREBASE_PROJECT_ID_FALLBACK: aims-flow
  AIMS_FIREBASE_MESSAGING_SENDER_ID_FALLBACK: '271406385287'
  AIMS_FIREBASE_ANDROID_APP_ID_FALLBACK: '1:271406385287:android:83e6c1cdc361ebfe289022'
  AIMS_FIREBASE_STORAGE_BUCKET_FALLBACK: aims-flow.firebasestorage.app

jobs:
  build-driver-apk:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android

      - name: Fetch protected AIMS production signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aims-flow-signing")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          SIGNING_JSON="$(curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             https://logistic-aims.hu/api/aims-signing/material.php)"
          SIGNING_JSON="$SIGNING_JSON" python3 - <<'PY'
          import base64, json, os, pathlib
          data=json.loads(os.environ["SIGNING_JSON"])
          if data.get("ok") is not True:
              raise SystemExit("AIMS signing vault rejected the build")
          store_password=str(data["storePassword"])
          key_password=str(data["keyPassword"])
          key_alias=str(data["keyAlias"])
          store_type=str(data.get("storeType","PKCS12"))
          fingerprint=str(data["certificateSha256"]).lower()
          expected="6c1b09640ee1666a7f6311614f7638c1a6afa2bc6584a22bc132d54eba7eaffa"
          if fingerprint != expected:
              raise SystemExit("Unexpected AIMS production certificate fingerprint")
          pathlib.Path("android/app/aims-flow-release.p12").write_bytes(
              base64.b64decode(data["keystoreB64"])
          )
          env=os.environ["GITHUB_ENV"]
          with open(env,"a",encoding="utf-8") as out:
              out.write(f"AIMS_SIGN_STORE_PASSWORD={store_password}\n")
              out.write(f"AIMS_SIGN_KEY_PASSWORD={key_password}\n")
              out.write(f"AIMS_SIGN_KEY_ALIAS={key_alias}\n")
              out.write("AIMS_SIGN_STORE_FILE=aims-flow-release.p12\n")
              out.write(f"AIMS_SIGN_STORE_TYPE={store_type}\n")
              out.write(f"AIMS_SIGN_CERT_SHA256={fingerprint}\n")
          print(f"::add-mask::{store_password}")
          print(f"::add-mask::{key_password}")
          print("Persistent AIMS production signing identity loaded.")
          PY
          chmod 600 android/app/aims-flow-release.p12

      - name: Configure Android for driver mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions=[
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          permission_block='\n'.join(
              f'    <uses-permission android:name="{name}" />'
              for name in permissions
          )
          queries='\n'.join([
              '    <queries>',
              '        <intent>',
              '            <action android:name="android.intent.action.TTS_SERVICE" />',
              '        </intent>',
              '    </queries>',
          ])
          s=s.replace(
              '<application',
              permission_block+'\n'+queries+'\n    <application',
              1,
          )
          s=s.replace(
              'android:label="aims_flow_scanner"',
              'android:label="AIMS Flow"',
          )

          p.write_text(s)

          native=Path('native/android')
          target=Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner')
          target.mkdir(parents=True,exist_ok=True)
          shutil.copy2(native/'MainActivity.kt',target/'MainActivity.kt')

          g=Path('android/app/build.gradle.kts')
          text=g.read_text()
          text=text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23',
          )

          # Core library desugaring is needed in both PR validation and release.
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text=text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring(' not in text:
              if 'dependencies {' in text:
                  text=text.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1,
                  )
              else:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'

          # Production signing is intentionally unavailable to pull requests.
          # PRs keep Flutter's generated debug signing and still compile a real
          # Android APK after analyze + unit tests.
          if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request':
              signing='\n'.join([
                  '    signingConfigs {',
                  '        create("release") {',
                  '            keyAlias = System.getenv("AIMS_SIGN_KEY_ALIAS")',
                  '            keyPassword = System.getenv("AIMS_SIGN_KEY_PASSWORD")',
                  '            storeFile = file(System.getenv("AIMS_SIGN_STORE_FILE"))',
                  '            storePassword = System.getenv("AIMS_SIGN_STORE_PASSWORD")',
                  '            storeType = System.getenv("AIMS_SIGN_STORE_TYPE") ?: "PKCS12"',
                  '        }',
                  '    }',
                  '',
                  '',
              ])
              if 'create("release")' not in text:
                  text=text.replace('    buildTypes {',signing+'    buildTypes {',1)
              text=text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
                  1,
              )
              if 'isMinifyEnabled = false' not in text:
                  text=text.replace(
                      'signingConfig = signingConfigs.getByName("release")',
                      'signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false',
                      1,
                  )
              if 'signingConfigs.getByName("debug")' in text:
                  raise SystemExit('Debug signing still present in release build')

          g.write_text(text)
          PY

      - name: Install AIMS Flow notification voices
        run: |
          mkdir -p android/app/src/main/res/raw
          base64 -d native/android/raw/aims_new_job.mp3.b64 > android/app/src/main/res/raw/aims_new_job.mp3
          base64 -d native/android/raw/aims_new_message.mp3.b64 > android/app/src/main/res/raw/aims_new_message.mp3
          test -s android/app/src/main/res/raw/aims_new_job.mp3
          test -s android/app/src/main/res/raw/aims_new_message.mp3
          test "$(stat -c%s android/app/src/main/res/raw/aims_new_job.mp3)" -gt 10000
          test "$(stat -c%s android/app/src/main/res/raw/aims_new_message.mp3)" -gt 10000

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: White text regression guard
        run: python3 ci/r105_white_text_guard.py

      - name: R106 male voice / navigation guard
        run: python3 ci/r106_voice_navigation_guard.py

      - name: Unit tests
        run: flutter test

      - name: Build PR validation APK
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN=ci-pr-validation

      - name: Build production release APK
        if: github.event_name != 'pull_request'
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          test -n "$AIMS_TRACKING_TOKEN"
          AIMS_FIREBASE_API_KEY="${AIMS_FIREBASE_API_KEY:-$AIMS_FIREBASE_API_KEY_FALLBACK}"
          AIMS_FIREBASE_PROJECT_ID="${AIMS_FIREBASE_PROJECT_ID:-$AIMS_FIREBASE_PROJECT_ID_FALLBACK}"
          AIMS_FIREBASE_MESSAGING_SENDER_ID="${AIMS_FIREBASE_MESSAGING_SENDER_ID:-$AIMS_FIREBASE_MESSAGING_SENDER_ID_FALLBACK}"
          AIMS_FIREBASE_ANDROID_APP_ID="${AIMS_FIREBASE_ANDROID_APP_ID:-$AIMS_FIREBASE_ANDROID_APP_ID_FALLBACK}"
          AIMS_FIREBASE_STORAGE_BUCKET="${AIMS_FIREBASE_STORAGE_BUCKET:-$AIMS_FIREBASE_STORAGE_BUCKET_FALLBACK}"
          flutter build apk --release \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN="$AIMS_TRACKING_TOKEN" \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"

      - name: Build Google Play App Bundle
        if: github.event_name != 'pull_request'
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AIMS_TRACKING_TOKEN"
          AIMS_FIREBASE_API_KEY="${AIMS_FIREBASE_API_KEY:-$AIMS_FIREBASE_API_KEY_FALLBACK}"
          AIMS_FIREBASE_PROJECT_ID="${AIMS_FIREBASE_PROJECT_ID:-$AIMS_FIREBASE_PROJECT_ID_FALLBACK}"
          AIMS_FIREBASE_MESSAGING_SENDER_ID="${AIMS_FIREBASE_MESSAGING_SENDER_ID:-$AIMS_FIREBASE_MESSAGING_SENDER_ID_FALLBACK}"
          AIMS_FIREBASE_ANDROID_APP_ID="${AIMS_FIREBASE_ANDROID_APP_ID:-$AIMS_FIREBASE_ANDROID_APP_ID_FALLBACK}"
          AIMS_FIREBASE_STORAGE_BUCKET="${AIMS_FIREBASE_STORAGE_BUCKET:-$AIMS_FIREBASE_STORAGE_BUCKET_FALLBACK}"
          flutter build appbundle --release \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN="$AIMS_TRACKING_TOKEN" \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"
          test -s build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab AIMS-Flow-R105.aab
          jarsigner -verify AIMS-Flow-R105.aab
          AAB_CERT_SHA256="$(keytool -printcert -jarfile AIMS-Flow-R105.aab             | sed -n 's/^[[:space:]]*SHA256: //p'             | head -1             | tr 'A-F' 'a-f'             | tr -d ':[:space:]')"
          test -n "$AAB_CERT_SHA256"
          if [ "$AAB_CERT_SHA256" != "$AIMS_SIGN_CERT_SHA256" ]; then
            echo "AAB signing certificate mismatch" >&2
            echo "Expected: $AIMS_SIGN_CERT_SHA256" >&2
            echo "Actual:   $AAB_CERT_SHA256" >&2
            exit 1
          fi
          sha256sum AIMS-Flow-R105.aab | tee AIMS-Flow-R105.aab.sha256

      - name: Verify production certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk > /tmp/apk-test.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs             build/app/outputs/flutter-apk/app-release.apk             | tee signing-certificate.txt
          if grep -qi 'Android Debug' signing-certificate.txt; then
            echo "Debug certificate detected in production APK" >&2
            exit 1
          fi
          CERT_DIGEST="$(grep -m1 'certificate SHA-256 digest:' signing-certificate.txt | sed 's/^.*certificate SHA-256 digest: //' | tr 'A-F' 'a-f' | tr -d ':')"
          test -n "$CERT_DIGEST"
          test "$CERT_DIGEST" = "$AIMS_SIGN_CERT_SHA256"
          cp build/app/outputs/flutter-apk/app-release.apk AIMS-Flow-R105.apk
          sha256sum AIMS-Flow-R105.apk | tee AIMS-Flow-R105.sha256
          ls -lh AIMS-Flow-R105.apk

      - name: Upload production-signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-R105-PRODUCTION-SIGNED
          path: |
            AIMS-Flow-R105.apk
            AIMS-Flow-R105.sha256
            AIMS-Flow-R105.aab
            AIMS-Flow-R105.aab.sha256
            signing-certificate.txt
          if-no-files-found: error
          retention-days: 30
