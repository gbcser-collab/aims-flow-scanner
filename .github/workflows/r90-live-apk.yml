name: Build AIMS Flow R90 LIVE Android

on:
  push:
    branches:
      - release/r90-live-apk
    paths:
      - 'lib/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/r90-live-apk.yml'
  workflow_dispatch:

env:
  AIMS_FIREBASE_API_KEY_FALLBACK: AIzaSyAAi61i7YCVXJ7Lh5QY0cYnZ42LISC-vNQ
  AIMS_FIREBASE_PROJECT_ID_FALLBACK: aims-flow
  AIMS_FIREBASE_MESSAGING_SENDER_ID_FALLBACK: '271406385287'
  AIMS_FIREBASE_ANDROID_APP_ID_FALLBACK: '1:271406385287:android:83e6c1cdc361ebfe289022'
  AIMS_FIREBASE_STORAGE_BUCKET_FALLBACK: aims-flow.firebasestorage.app

jobs:
  build-r90-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/aims_template
          flutter create --platforms=android --org hu.logisticaims --project-name aims_flow_scanner /tmp/aims_template
          cp -R /tmp/aims_template/android ./android

      - name: Configure production Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permissions=[
            'android.permission.CAMERA',
            'android.permission.INTERNET',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.FOREGROUND_SERVICE_MICROPHONE',
            'android.permission.RECORD_AUDIO',
            'android.permission.WAKE_LOCK',
            'android.permission.USE_BIOMETRIC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.VIBRATE',
          ]
          block='\n'.join(
              f'    <uses-permission android:name="{name}" />'
              for name in permissions
          )
          queries='\n'.join([
              '    <queries>',
              '        <intent><action android:name="android.speech.RecognitionService" /></intent>',
              '        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>',
              '    </queries>',
          ])
          s=s.replace('<application',block+'\n'+queries+'\n    <application',1)
          s=s.replace('android:label="aims_flow_scanner"','android:label="AIMS Flow"')

          assist='\n'.join([
              '            <intent-filter>',
              '                <action android:name="android.intent.action.ASSIST" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '            </intent-filter>',
              '',
          ])
          end=s.find('</activity>')
          if end < 0:
              raise SystemExit('MainActivity closing tag missing')
          s=s[:end]+assist+s[end:]

          service='\n'.join([
              '        <service',
              '            android:name=".AimsHandsFreeService"',
              '            android:enabled="true"',
              '            android:exported="false"',
              '            android:foregroundServiceType="microphone" />',
              '',
          ])
          s=s.replace('</application>',service+'    </application>',1)
          p.write_text(s)

          target=Path('android/app/src/main/kotlin/hu/logisticaims/aims_flow_scanner')
          target.mkdir(parents=True,exist_ok=True)
          shutil.copy2('native/android/MainActivity.kt',target/'MainActivity.kt')
          shutil.copy2('native/android/AimsHandsFreeService.kt',target/'AimsHandsFreeService.kt')

          g=Path('android/app/build.gradle.kts')
          text=g.read_text()
          text=text.replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          if 'isMinifyEnabled = false' not in text:
              text=text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text=text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring(' not in text:
              if 'dependencies {' in text:
                  text=text.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1,
                  )
              else:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          g.write_text(text)
          PY

      - name: Restore AIMS new-job push voice
        uses: actions/download-artifact@v4
        with:
          name: AIMS-Flow-R87-ANDROID
          path: /tmp/aims-old
          github-token: ${{ github.token }}
          run-id: 35437104934

      - name: Install bundled push voice
        run: |
          set -euo pipefail
          OLD_APK="$(find /tmp/aims-old -type f -name '*.apk' | head -1)"
          test -s "$OLD_APK"
          MP3_PATH="$(unzip -Z1 "$OLD_APK" | grep -E '^res/.*\.mp3$' | head -1)"
          test -n "$MP3_PATH"
          mkdir -p android/app/src/main/res/raw
          unzip -p "$OLD_APK" "$MP3_PATH" > android/app/src/main/res/raw/aims_new_job.mp3
          test -s android/app/src/main/res/raw/aims_new_job.mp3
          test "$(stat -c%s android/app/src/main/res/raw/aims_new_job.mp3)" -gt 10000
          sha256sum android/app/src/main/res/raw/aims_new_job.mp3

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Verify live configuration
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
        run: |
          test -n "$AIMS_TRACKING_TOKEN"
          echo "Live tracking secret is configured."

      - name: Build LIVE ARM64 release APK
        env:
          AIMS_TRACKING_TOKEN: ${{ secrets.AIMS_TRACKING_TOKEN }}
          AIMS_FIREBASE_API_KEY: ${{ secrets.AIMS_FIREBASE_API_KEY }}
          AIMS_FIREBASE_PROJECT_ID: ${{ secrets.AIMS_FIREBASE_PROJECT_ID }}
          AIMS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AIMS_FIREBASE_MESSAGING_SENDER_ID }}
          AIMS_FIREBASE_ANDROID_APP_ID: ${{ secrets.AIMS_FIREBASE_ANDROID_APP_ID }}
          AIMS_FIREBASE_STORAGE_BUCKET: ${{ secrets.AIMS_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          AIMS_FIREBASE_API_KEY="${AIMS_FIREBASE_API_KEY:-$AIMS_FIREBASE_API_KEY_FALLBACK}"
          AIMS_FIREBASE_PROJECT_ID="${AIMS_FIREBASE_PROJECT_ID:-$AIMS_FIREBASE_PROJECT_ID_FALLBACK}"
          AIMS_FIREBASE_MESSAGING_SENDER_ID="${AIMS_FIREBASE_MESSAGING_SENDER_ID:-$AIMS_FIREBASE_MESSAGING_SENDER_ID_FALLBACK}"
          AIMS_FIREBASE_ANDROID_APP_ID="${AIMS_FIREBASE_ANDROID_APP_ID:-$AIMS_FIREBASE_ANDROID_APP_ID_FALLBACK}"
          AIMS_FIREBASE_STORAGE_BUCKET="${AIMS_FIREBASE_STORAGE_BUCKET:-$AIMS_FIREBASE_STORAGE_BUCKET_FALLBACK}"

          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --dart-define=AIMS_TRACKING_BASE_URL=https://logistic-aims.hu/api/aims-tracking \
            --dart-define=AIMS_TRACKING_TOKEN="$AIMS_TRACKING_TOKEN" \
            --dart-define=AIMS_FIREBASE_API_KEY="$AIMS_FIREBASE_API_KEY" \
            --dart-define=AIMS_FIREBASE_PROJECT_ID="$AIMS_FIREBASE_PROJECT_ID" \
            --dart-define=AIMS_FIREBASE_MESSAGING_SENDER_ID="$AIMS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=AIMS_FIREBASE_ANDROID_APP_ID="$AIMS_FIREBASE_ANDROID_APP_ID" \
            --dart-define=AIMS_FIREBASE_STORAGE_BUCKET="$AIMS_FIREBASE_STORAGE_BUCKET"

      - name: APK integrity and identity
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          unzip -t "$APK" > /tmp/r90-live-apk-integrity.txt
          tail -5 /tmp/r90-live-apk-integrity.txt
          cp "$APK" AIMS-Flow-R90-LIVE-ARM64.apk
          sha256sum AIMS-Flow-R90-LIVE-ARM64.apk | tee AIMS-Flow-R90-LIVE-ARM64.sha256
          ls -lh AIMS-Flow-R90-LIVE-ARM64.apk

      - name: Upload LIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Flow-R90-LIVE-ARM64
          path: |
            AIMS-Flow-R90-LIVE-ARM64.apk
            AIMS-Flow-R90-LIVE-ARM64.sha256
          if-no-files-found: error
          retention-days: 30
